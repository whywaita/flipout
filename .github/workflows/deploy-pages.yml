name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Restore staged Pages site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote_url" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$remote_url" pages-site
          else
            mkdir pages-site
            git -C pages-site init
            git -C pages-site checkout -b gh-pages
            git -C pages-site remote add origin "$remote_url"
          fi

      - name: Stage production site
        run: .github/scripts/stage-pages-site.sh production pages-site build/web

      - name: Commit staged Pages site
        run: |
          set -euo pipefail
          git -C pages-site config user.name "github-actions[bot]"
          git -C pages-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages-site add -A
          if git -C pages-site diff --cached --quiet; then
            echo "No Pages staging changes."
          else
            git -C pages-site commit -m "Deploy GitHub Pages"
            git -C pages-site push origin gh-pages
          fi

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          rm -rf pages-artifact
          mkdir pages-artifact
          cp -a pages-site/. pages-artifact/
          rm -rf pages-artifact/.git

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

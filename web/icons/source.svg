<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="55%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="backCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0a5d56"/>
    </linearGradient>
    <linearGradient id="frontCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="34" flood-color="#062a25" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- background tile -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#topGlow)"/>

  <!-- back card peeking from the left -->
  <g transform="translate(388, 540) rotate(-20)" filter="url(#cardShadow)">
    <rect x="-260" y="-360" width="520" height="720" rx="36" fill="url(#backCard)" stroke="#5eead4" stroke-width="8"/>
    <rect x="-220" y="-320" width="440" height="640" rx="22" fill="none" stroke="rgba(255,255,255,0.40)" stroke-width="4"/>
    <g fill="rgba(255,255,255,0.18)">
      <rect x="-160" y="-260" width="320" height="520" rx="6"/>
    </g>
    <g fill="rgba(255,255,255,0.32)">
      <rect x="-80" y="-30" width="160" height="60" rx="4"/>
    </g>
  </g>

  <!-- front card: ace of spades -->
  <g transform="translate(580, 510) rotate(-6)" filter="url(#cardShadow)">
    <rect x="-260" y="-360" width="520" height="720" rx="36" fill="url(#frontCard)"/>
    <rect x="-260" y="-360" width="520" height="720" rx="36" fill="none" stroke="#0f172a" stroke-width="2" opacity="0.08"/>

    <!-- corner index top-left -->
    <text x="-200" y="-220" text-anchor="middle"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="120" font-weight="900" fill="#0f172a">A</text>
    <text x="-200" y="-95" text-anchor="middle"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="120" fill="#0f172a">♠</text>

    <!-- corner index bottom-right (rotated) -->
    <g transform="translate(200, 270) rotate(180)">
      <text x="0" y="-50" text-anchor="middle"
            font-family="'Helvetica Neue', Arial, sans-serif"
            font-size="120" font-weight="900" fill="#0f172a">A</text>
      <text x="0" y="76" text-anchor="middle"
            font-family="'Helvetica Neue', Arial, sans-serif"
            font-size="120" fill="#0f172a">♠</text>
    </g>

    <!-- centre big spade -->
    <text x="0" y="130" text-anchor="middle"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="420" font-weight="900" fill="#0f172a">♠</text>
  </g>
</svg>
